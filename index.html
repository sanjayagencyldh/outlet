  // ==========================================
  // DISTANCE CALCULATION
  // ==========================================

  function getDistance(lat1, lon1, lat2, lon2) {

    const R = 6371; // Earth radius in KM

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) *
      Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c =
      2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return R * c;
  }


  // ==========================================
  // FIND ALL STORES WITHIN 10 KM
  // ==========================================

  function findStores() {

    const result = document.getElementById("result");

    result.innerHTML = "<p class='subtitle'>Getting your location...</p>";


    // Check browser GPS support

    if (!navigator.geolocation) {

      result.innerHTML =
        '<p class="error">GPS is not supported by your browser.</p>';

      return;
    }


    // Get user's location

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        const radius = 5;


        // Calculate distance for every store

        const nearbyStores = stores
          .map(function(store) {

            const distance = getDistance(
              userLat,
              userLng,
              store.lat,
              store.lng
            );

            return {
              ...store,
              distance: distance
            };

          })

          // Keep only stores within 10 km

          .filter(function(store) {
            return store.distance <= radius;
          })

          // Sort nearest first

          .sort(function(a, b) {
            return a.distance - b.distance;
          });


        // ==========================================
        // NO STORES FOUND
        // ==========================================

        if (nearbyStores.length === 0) {

          result.innerHTML = `

            <div class="store">

              <h3>😔 No Stores Found</h3>

              <p>
                There are no stores within 10 km
                of your current location.
              </p>

            </div>

          `;

          return;
        }


        // ==========================================
        // DISPLAY ALL NEARBY STORES
        // ==========================================

        let html = `

          <div class="count">
            ${nearbyStores.length}
            store${nearbyStores.length > 1 ? "s" : ""}
            found within 5 km
          </div>

        `;


        nearbyStores.forEach(function(store) {

          const mapsUrl =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" +
            userLat +
            "," +
            userLng +
            "&destination=" +
            store.lat +
            "," +
            store.lng;


          html += `

            <div class="store">

              <h3> ${store.name}</h3>

              <div class="address">
                ${store.address}
              </div>

              <div class="distance">
                ${store.distance.toFixed(2)} KM AWAY
              </div>

               
			  <a
                class="directions"
                href="${mapsUrl}"
                target="_blank"
              >
              <img src="./loc.png">  Get Directions
              </a>

            </div>

          `;

        });


        result.innerHTML = html;

      },


      // ==========================================
      // LOCATION ERROR
      // ==========================================

      function(error) {

        let message = "Unable to get your location.";

        if (error.code === 1) {
          message =
            "Please allow location access to find nearby stores.";
        }

        if (error.code === 2) {
          message =
            "Your location could not be determined.";
        }

        if (error.code === 3) {
          message =
            "Location request timed out. Please try again.";
        }


        result.innerHTML =
          '<p class="error">❌ ' + message + '</p>';

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000
      }

    );

  }
